<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF → 飞书知识库</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header><div class="brand">纸页 <span>→</span> 知识库</div><span class="badge">本地转换 · v0.2.5</span></header>
  <main>
    <section class="intro"><p class="eyebrow">PDF TO FEISHU</p><h1>让文档，成为可编辑的知识。</h1><p>本地解析 PDF，核对内容后保存到指定飞书知识库。复杂区域用图片保留，原文件随文档附上。</p></section>
    <div id="setup" class="notice" role="status" hidden></div>
    <div class="workspace">
      <aside class="panel controls">
        <h2><span class="step">1</span> 选择文件与位置</h2>
        <form id="upload-form">
          <label class="drop" for="file"><strong>选择一个文字型 PDF</strong><span>最大 20 MB · 100 页</span><input id="file" type="file" accept="application/pdf,.pdf" required></label>
          <button id="convert" type="submit">开始本地转换</button>
        </form>
        <label for="title">文档标题</label><input id="title" maxlength="200" placeholder="默认使用文件名">
        <label for="target">知识库父页面链接</label><input id="target" type="url" placeholder="https://公司.feishu.cn/wiki/…">
        <button id="resolve" class="secondary" type="button">检查保存位置</button>
        <p id="target-name" class="muted"></p>
        <div class="divider"></div>
        <h2><span class="step">3</span> 确认并保存</h2>
        <label class="check"><input id="confirmed" type="checkbox">我已核对原文、代码片段、转换结果和图片保留提示</label>
        <button id="publish" disabled type="button">保存到飞书</button>
        <p class="muted small">普通文字、代码与表格尽量可编辑；预览不代表飞书最终版式，也不保证逐像素一致。</p>
        <div class="divider"></div>
        <label for="history">最近任务</label><select id="history"><option value="">选择任务查看进度</option></select>
      </aside>
      <section class="panel preview-panel">
        <div class="preview-heading"><h2><span class="step">2</span> 对照转换结果</h2><a id="original" hidden>下载原 PDF</a></div>
        <div id="status" role="status" aria-live="polite">等待选择文件</div>
        <div id="error" class="error" role="alert" hidden></div>
        <div id="result" class="success" hidden></div>
        <div id="notices" class="notice" hidden></div>
        <div id="empty"><div class="paper-icon">↗</div><h3>先上传一份 PDF</h3><p>原文和转换结果将在这里并排呈现。</p><p class="small">解析在本机完成，点击保存后才上传到飞书。</p></div>
        <div id="preview"></div>
      </section>
    </div>
  </main>
  <footer>原文留存 · 来源可追溯 · 保存前由你确认</footer>
</body>
</html>
