name: Model and OCR (manual, no Feishu writes)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  models:
    name: macOS-model-and-vision
    runs-on: macos-14
    timeout-minutes: 45
    env:
      FEISHU_APP_ID: ''
      FEISHU_APP_SECRET: ''
      FEISHU_PARENT_URL: ''
      FEISHU_NOTIFY_ENABLED: 'false'
      RUN_LIVE_TESTS: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: '0.11.16'
          python-version: '3.12'
          enable-cache: true
      - name: Prepare models (network allowed only for setup)
        run: |
          uv sync --locked --group dev --extra parser
          .venv/bin/python scripts/download_models.py
      - name: Execute required offline model and Vision tests
        run: .venv/bin/python scripts/check_ci.py models
      - name: Preserve model/OCR evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-ocr-${{ github.sha }}
          path: output/ci/
          retention-days: 14
          if-no-files-found: warn
