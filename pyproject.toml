[project]
name = "files-to-feishu"
version = "0.4.0"
description = "Local PDF and WeChat article preview with editable Feishu wiki import"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.18,<1",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.28,<1",
  "pypdf>=5,<7",
  "pypdfium2>=4.30,<6",
  "pillow>=11,<13",
  "beautifulsoup4>=4.13,<5",
  "playwright>=1.55,<2",
]

[project.optional-dependencies]
parser = [
    "docling>=2.50,<3",
    "pyobjc-framework-vision>=11,<13 ; sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2", "reportlab>=4,<5"]

[project.scripts]
files-to-feishu = "files_to_feishu.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["parser: real Docling models required", "live: writes to explicitly configured Feishu test parent"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
files = ["src/files_to_feishu"]
